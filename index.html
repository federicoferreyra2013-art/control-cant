<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>Control-CANT</title>
</head>
<body>
<section id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="logo">C</div>
    <h1>Control-CANT</h1>
    <p>Control diario de personal</p>
    <label>Usuario</label>
    <input id="username" autocomplete="username" placeholder="Usuario">
    <label>Contraseña</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="Contraseña">
    <button id="loginBtn" class="primary big">INGRESAR</button>
    <p id="loginError" class="error"></p>
  </div>
</section>

<div id="app" class="hidden">
<header>
  <div>
    <h1>Control-CANT</h1>
    <p id="userLabel">Control diario</p>
  </div>
  <button id="logoutBtn" class="small">Salir</button>
</header>

<nav class="tabs">
  <button class="tab active" data-view="control">Control</button>
  <button class="tab" data-view="historial">Historial</button>
  <button class="tab admin-only" data-view="personal">Personal</button>
</nav>

<main>
<section id="view-control" class="view">
  <section class="card">
    <div class="grid2">
      <div><label for="fecha">Fecha</label><input id="fecha" type="date"></div>
      <div><label for="turno">Turno</label>
        <select id="turno"><option>Mañana</option><option>Tarde</option><option>Noche</option></select>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="section-title">
      <div><h2>Personal</h2><p class="hint">Un solo toque para marcar.</p></div>
      <button id="markAllBtn" class="secondary">Marcar todos</button>
    </div>
    <div id="people" class="people"></div>
  </section>

  <section class="card">
    <h2>Resumen</h2>
    <div class="summary">
      <div><b id="total">0</b><span>Total</span></div>
      <div><b id="presentes">0</b><span>Marcados</span></div>
      <div><b id="faltan">0</b><span>Sin marcar</span></div>
    </div>
    <button id="saveBtn" class="save">GUARDAR CONTROL DEL DÍA</button>
    <p id="status" class="status"></p>
  </section>
</section>

<section id="view-historial" class="view hidden">
  <section class="card">
    <div class="section-title"><h2>Historial</h2><button id="exportBtn" class="secondary">Exportar</button></div>
    <div id="history"></div>
  </section>
</section>

<section id="view-personal" class="view hidden admin-only">
  <section class="card">
    <div class="section-title"><h2>Administrar personal</h2><button id="addPersonBtn" class="primary">+ Agregar</button></div>
    <div id="adminPeople"></div>
  </section>
</section>
</main>
</div>

<dialog id="personDialog">
<form method="dialog" id="personForm">
<h2>Agregar persona</h2>
<input id="personName" required maxlength="60" placeholder="Nombre y apellido">
<div class="dialog-actions"><button value="cancel">Cancelar</button><button id="confirmPerson" class="primary" value="default">Agregar</button></div>
</form>
</dialog>
<script src="app.js"></script>
</body>
</html>
